upstream duelo { server 127.0.0.1:34567; }
limit_req_zone $binary_remote_addr zone=duelo:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=duelo_auth:10m rate=2r/s;
server {
  listen 80; server_name duel.enset.work;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl; server_name duel.enset.work;
  ssl_certificate /etc/ssl/duel.enset.work/origin.crt;
  ssl_certificate_key /etc/ssl/duel.enset.work/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  # IP réelle des joueurs derrière Cloudflare (item 15)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
  add_header Strict-Transport-Security "max-age=63072000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  client_max_body_size 4m;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  # Auth et inscriptions : débit strict (l'appli limite aussi : 5 logins/10 min, 3 comptes/h/IP).
  location ~ ^/api/v1/auth/(login|register|guest)$ { limit_req zone=duelo_auth burst=5 nodelay; proxy_pass http://duelo; }
  # 443 réservé à Cloudflare (item 13)
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;
  location /live { proxy_pass http://duelo; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s; proxy_send_timeout 3600s; }
  location / { limit_req zone=duelo burst=30 nodelay; proxy_pass http://duelo;
    location ~* \.(css|js|woff2|svg)$ { proxy_pass http://duelo; expires 1y; add_header Cache-Control "public, immutable"; } }
}
